name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: teus123321
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23FFD700&color_dots=%230A0F1E,%231A3EBF,%233D8BFF,%23AACFFF,%23FFD700&color_dark=%23FFD700
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23FFD700&color_dots=%230A0F1E,%231A3EBF,%233D8BFF,%23AACFFF,%23FFD700

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
