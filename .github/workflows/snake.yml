name: Generate Snake
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main
jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: teus123321
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2300F5D4&color_dots=%230D0221,%232E0854,%235B0E9E,%23C77DFF,%2300F5D4&color_dark=%2300F5D4
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2300F5D4&color_dots=%230D0221,%232E0854,%235B0E9E,%23C77DFF,%2300F5D4
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
